# ruxia-api, production: mongo (a one-node replica set) with its search
# component (mongot, for the projects' vector index), redis, minio, ollama-embed
# (the documents' embeddings), the API and its migration one-shot. Run from this folder (deploy.sh does):
#
#   cp .env.example .env     # fill every value, mode 600
#   ./deploy.sh
#
# No `ports:` anywhere: the API is reached by ruxia-ui's BFF over the external
# `proxy` network, with API_PROXY_SECRET. Mongo, Redis and MinIO sit on the
# stack's own internal network and have no route in. Every service has
# resource limits and a light healthcheck (every 30 s once up).
name: ruxia

networks:
  proxy:
    external: true
  data:
    internal: true
  # Outbound only: ollama-embed pulls its model from the Ollama registry.
  egress: {}

volumes:
  mongo-data:
  redis-data:
  minio-data:
  mongot-data:
  ollama-data:

x-api-env: &api-env
  NODE_ENV: production
  PORT: "3000"
  MONGO_URI: mongodb://ruxia-mongo:27017/?replicaSet=rs0
  MONGO_DATABASE: ruxia
  REDIS_URL: redis://ruxia-redis:6379
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
  EMBED_BASE_URL: http://ruxia-ollama-embed:11434
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  TITLE_MODEL_ID: ${TITLE_MODEL_ID:-claude-haiku-5-5}
  UI_ORIGIN: ${UI_ORIGIN:?}
  MAIL_FROM: ${MAIL_FROM:?}
  SMTP_HOST: ${SMTP_HOST:?}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_TLS_SERVERNAME: ${SMTP_TLS_SERVERNAME:-}
  API_PROXY_SECRET: ${API_PROXY_SECRET:?}
  TOTP_KEYS: ${TOTP_KEYS:?}
  S3_ENDPOINT: http://ruxia-minio:9000
  S3_REGION: us-east-1
  S3_BUCKET: ruxia-media
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:?}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?}

services:
  mongo:
    image: mongo:8.3.17
    container_name: ruxia-mongo
    restart: unless-stopped
    init: true
    # The search parameters point mongod at mongot (gRPC, port 27028, no TLS on
    # the internal network). See deploy/mongot/mongot.yml.
    command:
      - --replSet=rs0
      - --bind_ip_all
      - --setParameter=mongotHost=ruxia-mongot:27028
      - --setParameter=searchIndexManagementHostAndPort=ruxia-mongot:27028
      - --setParameter=useGrpcForSearch=true
      - --setParameter=searchTLSMode=disabled
    networks: [data]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval
          "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'ruxia-mongo:27017' }] }) }; quit(db.hello().isWritablePrimary ? 0 : 1)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
      start_interval: 2s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: ruxia-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    networks: [data]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
      start_interval: 2s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: ruxia-minio
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    networks: [data]
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # The user mongot syncs with (role searchCoordinator), made once: idempotent.
  mongot-user:
    image: mongo:8.3.17
    container_name: ruxia-mongot-user
    restart: "no"
    entrypoint:
      ["mongosh", "--quiet", "mongodb://ruxia-mongo:27017/admin?replicaSet=rs0"]
    command:
      - --eval
      - >-
        if (!db.getUser('mongotUser')) db.createUser({ user: 'mongotUser', pwd: process.env.MONGOT_PASSWORD, roles: ['searchCoordinator'] })
    environment:
      MONGOT_PASSWORD: ${MONGOT_PASSWORD:?}
    networks: [data]
    depends_on:
      mongo:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  mongot:
    image: mongodb/mongodb-community-search:1.79.1
    container_name: ruxia-mongot
    restart: unless-stopped
    networks: [data]
    volumes:
      - mongot-data:/data/mongot
      - ./mongot/mongot.yml:/mongot-community/config.default.yml:ro
    secrets: [mongot_password]
    depends_on:
      mongo:
        condition: service_healthy
      mongot-user:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://localhost:8080/health || wget -q -O /dev/null http://localhost:8080/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  # The embeddings of the projects' documents: nomic-embed-text, on the CPU.
  ollama-embed:
    image: ollama/ollama:0.40.18
    container_name: ruxia-ollama-embed
    restart: unless-stopped
    networks: [data, egress]
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/11434'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
      start_interval: 2s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  # Pulls the model once (a no-op when it is there), then ends. The API does not
  # wait for it: a document indexed before the pull ends is FAILED
  # EMBEDDINGS_UNAVAILABLE or retried, and `reindexProjectDocument` brings it back.
  ollama-pull:
    image: ollama/ollama:0.40.18
    container_name: ruxia-ollama-pull
    restart: "no"
    entrypoint: ["ollama", "pull", "nomic-embed-text"]
    environment:
      OLLAMA_HOST: ruxia-ollama-embed:11434
    networks: [data, egress]
    depends_on:
      ollama-embed:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  api-migrate:
    build:
      context: ..
      secrets: [npm_read]
    image: ruxia-api:latest
    container_name: ruxia-api-migrate
    restart: "no"
    command:
      [
        "sh",
        "-c",
        "bun --no-install dist/scripts/db-sync.js && bun --no-install dist/scripts/db-migrate.js",
      ]
    environment: *api-env
    networks: [data]
    depends_on:
      mongo:
        condition: service_healthy
      # db-sync creates the vector index: mongot must be serving.
      mongot:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  api:
    image: ruxia-api:latest
    container_name: ruxia-api
    restart: unless-stopped
    environment: *api-env
    networks: [data, proxy]
    depends_on:
      api-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
      start_interval: 2s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

secrets:
  npm_read:
    environment: NPM_SOFTISTX_READ_TOKEN
  mongot_password:
    environment: MONGOT_PASSWORD
