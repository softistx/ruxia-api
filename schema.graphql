scalar CIDRv6 @specifiedBy(url: "https://www.rfc-editor.org/rfc/rfc4291")

"""
A conversation between the signed-in member and a persona (spec 4.4). Only its
owner reads it: another member gets `conversations.errors.not-found`, and so
does the admin. A conversation nobody has written in yet is not listed.
"""
type Conversation {
  """The last message of the branch shown; null while nothing was said."""
  activeLeafId: ID
  """
  The id of the answer being written (the assistant message's id); null while idle.
  """
  activeRunId: ID
  """When it was created."""
  createdAt: DateTime!
  """When it was deleted (restorable for 30 days); null while it is live."""
  deletedAt: DateTime
  """The conversation's id."""
  id: ID!
  """When the last message was written."""
  lastMessageAt: DateTime!
  """
  The messages of the branch shown, newest first, from its leaf up to the
  first message. 400 `conversations.errors.invalid-cursor` for a cursor that
  does not belong to this branch.
  """
  messages(
    """The `endCursor` of the previous page."""
    after: String @constraint(maxLength: 500)
    """How many messages to read."""
    first: Int = 50 @constraint(min: 1, max: 200)
  ): MessageConnection!
  """The model the next message goes to."""
  modelId: String!
  """
  The persona itself while the member may still read it (deleted ones too);
  null once it is PRIVATE and someone else's. `personaSnapshot` always shows.
  """
  persona: Persona
  """The persona it was started with."""
  personaId: ID!
  """The persona's name and avatar when the conversation started."""
  personaSnapshot: PersonaSnapshot!
  """
  The project the conversation belongs to (its instructions and documents join every run); null when it has none.
  """
  projectId: ID
  """
  When it will be purged for good (30 days after it was deleted); null while it is live.
  """
  purgeAt: DateTime
  """A short title written after the first exchange; null until then."""
  title: String
  """When it last changed."""
  updatedAt: DateTime!
  """
  Send it back as `version` where an update asks for it: a stale one is refused.
  """
  version: Int!
}

"""A page of conversations."""
type ConversationConnection {
  """The conversations of the page."""
  edges: [ConversationEdge!]!
  """Where the page stands."""
  pageInfo: PageInfo!
  """How many conversations there are in all."""
  totalCount: Int!
}

"""One conversation of a page."""
type ConversationEdge {
  """The conversation."""
  node: Conversation!
}

"""What `conversations` narrows to."""
input ConversationFilter {
  """
  True lists the trash instead: the member's conversations deleted less than
  30 days ago (restorable), the latest deletion first. A search does not apply
  to it. False or left out lists the live ones.
  """
  deleted: Boolean
  """Only the conversations held with this persona."""
  personaId: ID @constraint(maxLength: 64)
  """Only the conversations of this project."""
  projectId: ID @constraint(maxLength: 64)
  """
  Only the conversations whose title or messages contain every word, in the same title or message (full-text,
  case and accents ignored, whole words). Operators are never interpreted; the
  text is cut at 100 characters and 8 words; nothing searchable left means no
  narrowing.
  """
  search: String @constraint(maxLength: 500)
}

"""An ISO 3166-1 alpha-2 country code, such as FR."""
scalar CountryCode @specifiedBy(url: "https://www.iso.org/iso-3166-country-codes.html")

"""The persona to create. The owner is the signed-in member."""
input CreatePersonaInput {
  """An avatar key the member uploaded to `/media/persona-avatars`."""
  avatarKey: String @constraint(maxLength: 64)
  """The model a new conversation starts on: an enabled model."""
  defaultModelId: String! @constraint(minLength: 1, maxLength: 200)
