}

"""A member's own settings (spec 4.16), visible to the member alone."""
type MemberSettings {
  """The persona a new conversation starts with; null until chosen."""
  defaultPersonaId: ID
  """The language of the app and of the mails."""
  language: Language!
  """Whether push notifications show the message text."""
  pushPreviews: Boolean!
  """Whether the persona saves what it learns without asking first."""
  rememberWithoutAsking: Boolean!
  """Whether a voice reply plays by itself."""
  voiceAutoPlay: Boolean!
}

"""
The settings to change; a field left out is kept, `defaultPersonaId: null` clears it.
"""
input MemberSettingsInput {
  """The persona a new conversation starts with; null clears it."""
  defaultPersonaId: ID @constraint(maxLength: 64)
  """The language of the app and of the mails."""
  language: Language
  """Whether push notifications show the message text."""
  pushPreviews: Boolean
  """Whether the persona saves what it learns without asking first."""
  rememberWithoutAsking: Boolean
  """Whether a voice reply plays by itself."""
  voiceAutoPlay: Boolean
}

"""
A model a conversation may pick (spec 2). Claude models are seeded; Ollama
models are found by a probe and stay disabled until an administrator enables
them.
"""
type Model {
  """
  Whether a send to it can succeed now. Always true for a Claude model; an
  Ollama model is available while its server answers and has it installed
  (a probe every 30 seconds), so false means "offline".
  """
  available: Boolean!
  """What it can do."""
  capabilities: [ModelCapability!]!
  """How many tokens of context it holds."""
  contextWindow: Int!
  """Whether an administrator allows conversations to use it."""
  enabled: Boolean!
  """The model's public id, e.g. `claude-sonnet-5-5` or `ollama:qwen3:14b`."""
  id: ID!
  """USD per million input tokens; null when it is free."""
  inputPrice: Float
  """The name shown to people."""
  label: String!
  """USD per million output tokens; null when it is free."""
  outputPrice: Float
  """Who serves it."""
  provider: ModelProvider!
}

"""What a model can do in a conversation."""
enum ModelCapability {
  """It can think before answering."""
  THINKING
  """It can call tools."""
  TOOLS
  """It reads images."""
  VISION
  """It can search the web through the provider's own tool."""
  WEB_SEARCH
}

"""Who serves a model."""
enum ModelProvider {
  """Anthropic's Claude API."""
  ANTHROPIC
  """
  An Ollama server (the owner's Mac): free, and offline when the Mac is off.
  """
  OLLAMA
}

"""
Write operations. There is no sign-up: an account exists only through an
invitation (acceptInvitation).
"""
type Mutation {
  """
  Accepts an invitation: makes the account with its password and signs the
  invitee in. Anonymous, counted by the caller's address. 400
  `invitations.errors.invalid` for an unknown, spent or expired token.
  """
  acceptInvitation(
    """The display name, the invitee's own."""
    name: String! @constraint(maxLength: 200)
    """The password the account starts with."""
    password: String! @constraint(maxLength: 1024)
    """The token of the mailed link."""
    token: String! @constraint(maxLength: 200)
  ): SignInPayload!
  """
  The first code of the app: the factor is active from now on, and its ten
  recovery codes are answered, once. Needs a session confirmed within 10
  minutes (403 `auth.errors.step-up-required`); the tries are counted by the
  client address (429 `auth.errors.too-many-attempts`). 400
  `auth.errors.invalid-code`; 409 `auth.errors.second-factor-state` without a
  started or with an active factor. The account is mailed a notice. Every other
  session of the account is signed out; the one that activates keeps working.
  """
  activateSecondFactor(
    """The app's first code, at most 20 characters."""
    code: String! @constraint(maxLength: 20)
  ): RecoveryCodes!
  """
  The code of the authenticator app, for the challenge signIn (or
  confirmMagicLink) answered. 400 `auth.errors.invalid-code` (with
  `attemptsLeft`) for a wrong code, a code already used included;
  `auth.errors.invalid-token` for a challenge unknown, spent or expired; 429
  `auth.errors.too-many-attempts` past the per-IP limit on passwords and codes.
  """
  confirmSecondFactor(
    """The `challenge` of the SECOND_FACTOR answer."""
    challenge: String! @constraint(maxLength: 200)
    """The current code of the authenticator app, at most 20 characters."""
    code: String! @constraint(maxLength: 20)
  ): SignInPayload!
  """
  Confirms the step-up: the request's session counts as freshly confirmed for
  10 minutes, and the new `sessionConfirmedUntil` is answered. 400
  `auth.errors.invalid-code` (with `attemptsLeft`) for a wrong code, and with
  `reason` `throttled` and `retryAfter` (seconds) once the account's app-code
  window (five per 15 minutes) is spent;
  `auth.errors.invalid-token` for a challenge unknown, spent, expired, of
  another account's session or stale; 409 `auth.errors.second-factor-state`
  when the second factor changed since requestStepUp (ask again).
  """
  confirmStepUp(
    """The `challenge` of `requestStepUp`."""
    challenge: String! @constraint(maxLength: 200)
    """
    The code of the authenticator app or the mailed one, at most 20 characters.
    """
    code: String! @constraint(maxLength: 20)
  ): DateTime!
  """
  Disables a member: it is signed out and cannot sign in. The last active
  administrator cannot be disabled: 409 `members.errors.last-admin`.
  Administrators only.
  """
  disableMember(
    """The member's id."""
    id: ID! @constraint(maxLength: 64)
  ): Member!
  """
  Turns the second factor off, on a current code of the app. Needs a session
  confirmed within 10 minutes (403 `auth.errors.step-up-required`). A wrong code
  or no active factor is refused as regenerateRecoveryCodes does. The account is
  mailed a notice. The factor is optional, for an admin too.
  """
  disableSecondFactor(
    """A current code of the authenticator app, at most 20 characters."""
    code: String! @constraint(maxLength: 20)
  ): Boolean!
  """Enables a disabled member again. Administrators only."""
  enableMember(
    """The member's id."""
    id: ID! @constraint(maxLength: 64)
  ): Member!
  """
  Starts a TOTP second factor: show `uri` as a QR code. Needs a session
  confirmed within 10 minutes (403 `auth.errors.step-up-required`:
  requestStepUp, confirmStepUp, then send it again); 409
  `auth.errors.second-factor-state` when a factor is already active.
  """
  enrollSecondFactor: SecondFactorEnrolment!
  """
  Invites an address with a role and mails it the link. Administrators only.
  409 `invitations.errors.already-member` for an address that has an account,
  `invitations.errors.already-pending` for one already invited (revoke first),
  `invitations.errors.limit` past 200 pending.
  """
  inviteMember(
    """The address to invite."""
    email: EmailAddress!
    """The role it gets on accepting."""
    role: Role!
  ): Invitation!
  """Starts the registration of a passkey for the viewer."""
  passkeyRegistrationOptions: PasskeyChallenge!
  """
  Starts a passkey sign-in: anonymous, counted by the request's address (429
  `auth.errors.too-many-attempts`). Finish it with `signInWithPasskey`.
  """
  passkeySignInOptions: PasskeyChallenge!
  """
  A recovery code instead of the app's, for a lost phone; each works once. The
  account is mailed a notice. Refused as confirmSecondFactor.
  """
  recoverSecondFactor(
    """The `challenge` of the SECOND_FACTOR answer."""
    challenge: String! @constraint(maxLength: 200)
    """One unused recovery code, at most 40 characters."""
    recoveryCode: String! @constraint(maxLength: 40)
  ): SignInPayload!
  """
  Replaces all the recovery codes with ten new ones, on a current code of the
  app: the old ones stop working. Needs a session confirmed within 10 minutes
  (403 `auth.errors.step-up-required`). A wrong code is `auth.errors.invalid-code`
  (with `attemptsLeft`; past five tries per account in a 15-minute window,
  every call is refused, the right code included, with `extensions.reason`
  `throttled` and `extensions.retryAfter` in seconds; janus counts these tries
  together with the app codes given to confirmStepUp, which disableSecondFactor
  also goes through); no active factor is
  `auth.errors.second-factor-state`.
  """
  regenerateRecoveryCodes(
    """A current code of the authenticator app."""
    code: String! @constraint(maxLength: 20)
  ): RecoveryCodes!
  """
  Finishes it. Needs a session confirmed within 10 minutes (403
  `auth.errors.step-up-required`). 400 `auth.errors.passkey-invalid` (a response
  that does not verify, a bad name); 409 `auth.errors.passkey-taken` for a
  credential already registered and `auth.errors.passkey-limit` past the most an
  account may hold.
  """
  registerPasskey(
    """The `challenge` of `passkeyRegistrationOptions`."""
    challenge: String! @constraint(maxLength: 200)
    """The name to give it, 1 to 100 characters."""
    name: String! @constraint(minLength: 1, maxLength: 100)
    """What `navigator.credentials.create` produced."""
    response: JSONObject!
  ): Passkey!
  """
  Removes one of the viewer's passkeys; false for one that is not theirs. Needs
  a session confirmed within 10 minutes (403 `auth.errors.step-up-required`).
  """
  removePasskey(
    """The passkey's credential id."""
    id: ID! @constraint(maxLength: 200)
  ): Boolean!
  """
  Renames one of the viewer's passkeys; false for one that is not theirs.
  """
  renamePasskey(
    """The passkey's credential id."""
    id: ID! @constraint(maxLength: 200)
    """The new name, 1 to 100 characters."""
    name: String! @constraint(minLength: 1, maxLength: 100)
  ): Boolean!
  """
  Sends a password-reset link (`/auth/reset-password`). True once accepted,
  whether or not the e-mail holds an account; throttled as `requestMagicLink`.
  """
  requestPasswordReset(
    """The address to mail the link to, at most 320 characters."""
    email: String! @constraint(maxLength: 320)
  ): Boolean!
  """
  Starts a step-up of the request's session: a code of the authenticator app
  when the account has an active second factor, else a code mailed to the
  account's current address. 401 without a viewer; 429
  `auth.errors.too-many-attempts` past five mailed codes in 10 minutes.
  """
  requestStepUp: StepUpChallenge!
  """
  Sets a new password from a reset link's token, and signs the account out
  everywhere: sign in again after it. 400 `auth.errors.invalid-token`, 400
  `validation.errors.invalid-input` (a `too-short` issue on `password`); 429
  past the per-IP limit on tokens.
  """
  resetPassword(
    """The new password; at least 8, at most 1024 characters."""
    password: String! @constraint(maxLength: 1024)
    """The token of the reset link, at most 200 characters."""
    token: String! @constraint(maxLength: 200)
  ): Boolean!
  """
  Cancels a pending invitation. Administrators only. 404 `invitations.errors.not-found`, 409 `invitations.errors.not-pending`.
  """
  revokeInvitation(
    """The invitation's id."""
    id: ID! @constraint(maxLength: 64)
  ): Invitation!
  """
  Gives a member its one role. The last administrator cannot be demoted: 409
  `members.errors.last-admin`. Administrators only.
  """
  setMemberRole(
    """The member's id."""
    id: ID! @constraint(maxLength: 64)
    """The role to give."""
    role: Role!
  ): Member!
  """
