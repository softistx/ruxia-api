  modelId: String @constraint(minLength: 1, maxLength: 200)
  """The persona to talk to: the member's own or a TEAM one."""
  personaId: ID! @constraint(maxLength: 64)
}

"""
A step-up under way: keep `challenge` (never in a URL) and post it to confirmStepUp with the code.
"""
type StepUpChallenge {
  """Opaque, single-use value to post to `confirmStepUp` with the code."""
  challenge: String!
  """When the challenge and its code stop working (10 minutes)."""
  expiresAt: DateTime!
  """How the code is delivered and confirmed."""
  method: StepUpMethod!
}

"""How a step-up is confirmed."""
enum StepUpMethod {
  """
  A code of the authenticator app: the account has an active second factor. Nothing is mailed.
  """
  AUTHENTICATOR
  """A six-digit code mailed to the account's current address."""
  EMAIL
}

"""The team's usage for a month: figures only, never content or titles."""
type TeamUsage {
  """The default monthly budget, in USD."""
  defaultBudgetUsd: Float!
  """Every member, the biggest spender first."""
  members: [MemberUsage!]!
  """The team's figures per model, the dearest first."""
  models: [ModelUsage!]!
  """The month, `YYYY-MM`."""
  month: String!
  """What the whole team spent, in USD."""
  spentUsd: Float!
}

"""A time of day with its offset, such as 10:15:30Z (RFC 3339 full-time)."""
scalar Time @specifiedBy(url: "https://www.rfc-editor.org/rfc/rfc3339#section-5.6")

"""An IANA time zone name, such as Europe/Paris."""
scalar TimeZone @specifiedBy(url: "https://www.iana.org/time-zones")

"""
An instant, as an integer number of milliseconds since 1970-01-01T00:00:00Z.
"""
scalar Timestamp

"""A ULID: 26 characters of Crockford base32."""
scalar ULID @specifiedBy(url: "https://github.com/ulid/spec")

"""An absolute http or https URL."""
scalar URL @specifiedBy(url: "https://url.spec.whatwg.org/")

"""A UUID in its 8-4-4-4-12 hexadecimal form."""
scalar UUID @specifiedBy(url: "https://www.rfc-editor.org/rfc/rfc9562")

"""A version 4 (random) UUID."""
scalar UUIDv4 @specifiedBy(url: "https://www.rfc-editor.org/rfc/rfc9562")

"""A version 7 (time-ordered) UUID."""
scalar UUIDv7 @specifiedBy(url: "https://www.rfc-editor.org/rfc/rfc9562")

"""
The changes to a persona. A field left out stays as it is; `avatarKey` and
`voiceId` given as null are cleared; any other field given as null is refused
(`validation.errors.required` in `extensions.fields`).
"""
input UpdatePersonaInput {
  """
  An avatar key the member uploaded to `/media/persona-avatars`; null removes the avatar.
  """
  avatarKey: String @constraint(maxLength: 64)
  """The model a new conversation starts on: an enabled model."""
  defaultModelId: String @constraint(minLength: 1, maxLength: 200)
  """Display name."""
  name: String @constraint(minLength: 1, maxLength: 80)
  """The system prompt."""
  personality: String @constraint(maxLength: 20000)
  """
  The projects it may read, replacing the list (at most 50, each up to 64 characters).
  """
  projectIds: [String!] @constraint(maxItems: 50, minLength: 1, maxLength: 64)
  """One line that says who it is."""
  tagline: String @constraint(maxLength: 160)
  """What it may use; only the fields given change."""
  tools: PersonaToolsInput
  """
  The version read: another write since is refused (`personas.errors.version-conflict`). Left out, the change applies to the current version.
  """
  version: Int
  """Who may see it; PRIVATE again unfeatures it."""
  visibility: PersonaVisibility
  """The voice it speaks with; null clears it."""
  voiceId: String @constraint(maxLength: 100)
}

"""
What to change of a project. A field left out stays as it is; `name` and
`instructions` given as null are refused (`validation.errors.required`).
"""
input UpdateProjectInput {
  """The new instructions; at most 4000 characters once trimmed."""
  instructions: String @constraint(maxLength: 8000)
  """The new name."""
  name: String @constraint(minLength: 1, maxLength: 80)
  """
  The version the client read: another write since is 409 `projects.errors.version-conflict`.
  """
  version: Int
}

"""The signed-in member's usage for a month: figures only."""
type Usage {
  """The month's budget, in USD."""
  budgetUsd: Float!
  """Tokens read from the cache."""
  cacheReadTokens: Int!
  """Tokens written to the cache."""
  cacheWriteTokens: Int!
  """Input tokens."""
  inputTokens: Int!
  """How many replies."""
  messages: Int!
  """The same figures per model, the dearest first."""
  models: [ModelUsage!]!
  """The month, `YYYY-MM`."""
  month: String!
  """Output tokens."""
  outputTokens: Int!
  """How much of the budget is spent, in percent."""
  percent: Float!
  """What the replies cost, in USD."""
  spentUsd: Float!
  """Web searches."""
  webSearches: Int!
}

"""A UTC offset from -12:00 to +14:00, such as +05:30."""
scalar UtcOffset

"""The signed-in account."""
type Viewer {
  """Where the member stands against its budget this month."""
  budgetStatus: BudgetStatus!
  """The sign-in address."""
  email: EmailAddress!
  """Identifier of the account (the user id), also the member's id."""
  id: ID!
  """
  The account's preferred language: the one of its mails and security notices. French until the viewer chooses (updateMemberSettings).
  """
  locale: Language!
  """Display name."""
  name: String!
  """The viewer's passkeys, oldest first."""
  passkeys: [Passkey!]!
  """
  The account's one role. An account with none is refused: 403 `auth.errors.forbidden`.
  """
  role: Role!
  """
  The account's TOTP second factor: whether it is active, and the recovery codes left.
  """
  secondFactor: SecondFactorStatus!
  """
  Until when the request's session counts as freshly confirmed: its sign-in or
  its last step-up, plus 10 minutes. In the past when it no longer does; null
  when no session was read. A second factor or a passkey changes only on a
  session within it (403 `auth.errors.step-up-required`).
  """
  sessionConfirmedUntil: DateTime
  """
  When the request's session ends: the BFF sets its cookie's expiry to it. Sessions last 7 days and slide.
  """
  sessionExpiresAt: DateTime
  """The member's own settings."""
  settings: MemberSettings!
}

"""No value: always null."""
scalar Void

"""An xid: 20 characters of lowercase base32hex."""
scalar XID @specifiedBy(url: "https://github.com/rs/xid")
