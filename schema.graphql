  """The document's name."""
  name: String!
  """How close the passage is to the search, from 0 to 1."""
  score: Float!
  """The start of the passage, up to 400 characters."""
  snippet: String!
}

"""A page of messages."""
type MessageConnection {
  """The messages of the page."""
  edges: [MessageEdge!]!
  """Where the page stands."""
  pageInfo: PageInfo!
  """How many messages the branch holds in all."""
  totalCount: Int!
}

"""One message of a page."""
type MessageEdge {
  """The message."""
  node: Message!
}

"""
A part of a message, in order: text, reasoning, an attachment reference (a member's message), a citation of a project document or a proposed action to confirm. Tool calls and results are not shown.
"""
union MessagePart = MessageAttachmentPart | MessageCitationPart | MessageProposedActionPart | MessageTextPart | MessageThinkingPart

"""A proposed action of a message, as the confirmation card shows it."""
type MessageProposedActionPart {
  """The action's id, for `confirmAction` and `rejectAction`."""
  actionId: ID!
  """Where the action stands now."""
  status: ProposedActionStatus!
  """
  What the member is asked to confirm, in words; null when the tool gave none.
  """
  summary: String
  """The tool the model called."""
  tool: String!
}

"""Who wrote a message."""
enum MessageRole {
  """The persona's model."""
  ASSISTANT
  """The member."""
  USER
}

"""Where a message stands."""
enum MessageStatus {
  """Complete."""
  DONE
  """
  The run failed; `errorCode` says why and the parts are what was written before.
  """
  FAILED
  """The member stopped it; the parts are what was written before."""
  STOPPED
  """The answer is being written: its parts so far are partial."""
  STREAMING
}

"""A piece of plain text of a message."""
type MessageTextPart {
  """The text."""
  text: String!
}

"""
The model's reasoning, as far as the provider shows it (its signature is never exposed).
"""
type MessageThinkingPart {
  """The reasoning."""
  text: String!
}

"""
A model a conversation may pick (spec 2). Claude models are seeded; Ollama
models are found by a probe and stay disabled until an administrator enables
them.
"""
type Model {
  """
  Whether a send to it can succeed now. Always true for a Claude model; an
  Ollama model is available while its server answers and has it installed
  (a probe every 30 seconds), so false means "offline".
  """
  available: Boolean!
  """What it can do."""
  capabilities: [ModelCapability!]!
  """How many tokens of context it holds."""
  contextWindow: Int!
  """Whether an administrator allows conversations to use it."""
  enabled: Boolean!
  """The model's public id, e.g. `claude-sonnet-5-5` or `ollama:qwen3:14b`."""
  id: ID!
  """USD per million input tokens; null when it is free."""
  inputPrice: Float
  """The name shown to people."""
  label: String!
  """USD per million output tokens; null when it is free."""
  outputPrice: Float
  """Who serves it."""
  provider: ModelProvider!
}

"""What a model can do in a conversation."""
enum ModelCapability {
  """It can think before answering."""
  THINKING
  """It can call tools."""
  TOOLS
  """It reads images."""
  VISION
  """It can search the web through the provider's own tool."""
  WEB_SEARCH
}

"""Who serves a model."""
enum ModelProvider {
  """Anthropic's Claude API."""
  ANTHROPIC
  """
  An Ollama server (the owner's Mac): free, and offline when the Mac is off.
  """
  OLLAMA
}

"""What the replies of one model cost, and the tokens they used."""
type ModelUsage {
  """Tokens read from the cache."""
  cacheReadTokens: Int!
  """Tokens written to the cache."""
  cacheWriteTokens: Int!
  """Input tokens."""
  inputTokens: Int!
  """How many replies."""
  messages: Int!
  """The model's id, as the catalogue names it."""
  modelId: String!
  """Output tokens."""
  outputTokens: Int!
  """The cost, in USD."""
  spentUsd: Float!
  """Web searches."""
  webSearches: Int!
}

"""
Write operations. There is no sign-up: an account exists only through an
invitation (acceptInvitation).
"""
type Mutation {
  """
  Accepts an invitation: makes the account with its password and signs the
  invitee in. Anonymous, counted by the caller's address. 400
  `invitations.errors.invalid` for an unknown, spent or expired token.
  """
  acceptInvitation(
    """The display name, the invitee's own."""
    name: String! @constraint(maxLength: 200)
    """The password the account starts with."""
    password: String! @constraint(maxLength: 1024)
    """The token of the mailed link."""
    token: String! @constraint(maxLength: 200)
  ): SignInPayload!
  """
  The first code of the app: the factor is active from now on, and its ten
  recovery codes are answered, once. Needs a session confirmed within 10
  minutes (403 `auth.errors.step-up-required`); the tries are counted by the
  client address (429 `auth.errors.too-many-attempts`). 400
  `auth.errors.invalid-code`; 409 `auth.errors.second-factor-state` without a
  started or with an active factor. The account is mailed a notice. Every other
  session of the account is signed out; the one that activates keeps working.
  """
  activateSecondFactor(
    """The app's first code, at most 20 characters."""
    code: String! @constraint(maxLength: 20)
  ): RecoveryCodes!
  """
  Adds a fact the member wrote (source USER). 409 `memory.errors.full` past 200
  items for the persona; `text` is refused when blank or past 500 characters.
  """
  addMemoryItem(
    """The persona."""
    personaId: ID!
    """The fact; at most 500 characters once trimmed."""
    text: String! @constraint(maxLength: 2000)
  ): MemoryItem!
  """Deletes every fact the member has for a persona and answers how many."""
  clearMemory(
    """The persona."""
    personaId: ID!
  ): Int!
  """
  Confirms a pending action and applies it now; answers it with its outcome. A
  second confirm answers the stored outcome and runs nothing. 404
  `conversations.errors.action-not-found`; 409 `conversations.errors.action-expired`
  past its expiry (the action becomes EXPIRED; `rejectAction` answers the same).
  """
  confirmAction(
    """The action's id."""
    id: ID!
  ): ProposedAction!
  """
  The code of the authenticator app, for the challenge signIn (or
  confirmMagicLink) answered. 400 `auth.errors.invalid-code` (with
  `attemptsLeft`) for a wrong code, a code already used included;
  `auth.errors.invalid-token` for a challenge unknown, spent or expired; 429
  `auth.errors.too-many-attempts` past the per-IP limit on passwords and codes.
  """
  confirmSecondFactor(
    """The `challenge` of the SECOND_FACTOR answer."""
    challenge: String! @constraint(maxLength: 200)
    """The current code of the authenticator app, at most 20 characters."""
    code: String! @constraint(maxLength: 20)
  ): SignInPayload!
  """
  Confirms the step-up: the request's session counts as freshly confirmed for
  10 minutes, and the new `sessionConfirmedUntil` is answered. 400
  `auth.errors.invalid-code` (with `attemptsLeft`) for a wrong code, and with
  `reason` `throttled` and `retryAfter` (seconds) once the account's app-code
  window (five per 15 minutes) is spent;
  `auth.errors.invalid-token` for a challenge unknown, spent, expired, of
  another account's session or stale; 409 `auth.errors.second-factor-state`
  when the second factor changed since requestStepUp (ask again).
  """
  confirmStepUp(
    """The `challenge` of `requestStepUp`."""
    challenge: String! @constraint(maxLength: 200)
    """
    The code of the authenticator app or the mailed one, at most 20 characters.
    """
    code: String! @constraint(maxLength: 20)
  ): DateTime!
  """
  Creates a persona owned by the signed-in member. 409
  `personas.errors.model-unavailable` when `defaultModelId` is not an enabled
  model; `validation.errors.invalid` on `avatarKey` for a key the member did
  not upload.
  """
  createPersona(
    """The persona."""
    input: CreatePersonaInput!
  ): Persona!
  """
  Creates a project. 409 `projects.errors.too-many` past 50 projects; `name` is
  refused when blank and `instructions` past 4000 characters.
  """
  createProject(
    """Its name and instructions."""
    input: CreateProjectInput!
  ): Project!
  """
  Removes an upload no message carries yet (its file and its record). 404
  `attachments.errors.not-found`; 409 `attachments.errors.in-use` once a
  message carries it. Answers its id.
  """
  deleteAttachment(
    """The attachment's id."""
    id: ID! @constraint(maxLength: 64)
  ): ID!
  """
  Soft-deletes one of the member's conversations; it can be restored for 30
  days, then it is purged with its messages and exports. 404
  `conversations.errors.not-found`; 409 `conversations.errors.run-in-progress`
  while an answer is being written (stop it first).
  """
  deleteConversation(
    """The conversation's id."""
    id: ID! @constraint(maxLength: 64)
  ): Conversation!
  """Deletes one of the member's facts and answers its id."""
  deleteMemoryItem(
    """The item."""
    id: ID!
  ): ID!
  """
  Deletes the member's own persona (and unfeatures it): it leaves every list, and the conversations
  held with it stay readable. Answers its id. 404 `personas.errors.not-found`,
  403 `personas.errors.not-owner` as for an update.
  """
  deletePersona(
    """The persona's id."""
    id: ID! @constraint(maxLength: 64)
  ): ID!
  """
  Soft-deletes a project; it can be restored for 30 days, then it is purged with
  its documents, chunks and files. Runs stop searching it at once. 404
  `projects.errors.not-found`.
  """
  deleteProject(
    """The project's id."""
    id: ID! @constraint(maxLength: 64)
  ): Project!
  """
  Removes a document: its chunks, its file and its record. Answers its id. 404
  `projects.errors.document-not-found`.
  """
  deleteProjectDocument(
    """The document's id."""
    id: ID! @constraint(maxLength: 64)
  ): ID!
  """
  Disables a member: it is signed out and cannot sign in. The last active
  administrator cannot be disabled: 409 `members.errors.last-admin`.
  Administrators only.
  """
  disableMember(
    """The member's id."""
    id: ID! @constraint(maxLength: 64)
  ): Member!
  """
  Turns the second factor off, on a current code of the app. Needs a session
  confirmed within 10 minutes (403 `auth.errors.step-up-required`). A wrong code
  or no active factor is refused as regenerateRecoveryCodes does. The account is
  mailed a notice. The factor is optional, for an admin too.
  """
  disableSecondFactor(
    """A current code of the authenticator app, at most 20 characters."""
    code: String! @constraint(maxLength: 20)
  ): Boolean!
  """
  Copies a persona into a new PRIVATE one owned by the signed-in member: the
  member's own, or a TEAM one. The copy of someone else's keeps neither their
  MCP servers nor their projects. 404 `personas.errors.not-found` for a PRIVATE
  persona of someone else. The copy keeps the model even if it was disabled
  since: the member may change it, and a conversation refuses a disabled one.
  """
  duplicatePersona(
    """The persona's id."""
    id: ID! @constraint(maxLength: 64)
  ): Persona!
  """
  Edits a message of the member's: writes a sibling message (same parent, so
  a new branch) with `text` and starts the reply, as `sendMessage` does (the
  same limits and checks; the branch shown becomes the new one). 404
  `conversations.errors.message-not-found`; 409
  `conversations.errors.not-editable` for an answer, plus `sendMessage`'s.
  """
  editMessage(
    """
    The attachments of the new message (at most 10), as `SendMessageInput.attachmentIds`; none are inherited from the edited message.
    """
    attachmentIds: [ID!] @constraint(maxItems: 10, maxLength: 64)
    """The message to edit."""
    messageId: ID! @constraint(maxLength: 64)
    """What the member says now."""
    text: String! @constraint(minLength: 1, maxLength: 20000)
  ): SendMessagePayload!
  """Enables a disabled member again. Administrators only."""
  enableMember(
    """The member's id."""
    id: ID! @constraint(maxLength: 64)
  ): Member!
  """
  Starts a TOTP second factor: show `uri` as a QR code. Needs a session
  confirmed within 10 minutes (403 `auth.errors.step-up-required`:
  requestStepUp, confirmStepUp, then send it again); 409
  `auth.errors.second-factor-state` when a factor is already active.
  """
  enrollSecondFactor: SecondFactorEnrolment!
  """
  Stores the conversation as a file and returns its media key: the branch shown
  for MARKDOWN, the whole tree for JSON. Download it at
  `/media/conversation-exports/<key>` (the owner alone, while the conversation
  is live). A newer export of the same conversation and format replaces the
  previous file, so the previous key stops working: download at once. 404
  `conversations.errors.not-found` for an unknown, foreign or deleted
  conversation; 429 `conversations.errors.too-many-exports` past 10 exports an
  hour (burst 3); 503 `auth.errors.unavailable` when the file cannot be
  stored.
  """
  exportConversation(
    """The format."""
    format: ExportFormat!
    """The conversation's id."""
    id: ID! @constraint(maxLength: 64)
  ): String!
  """
  Invites an address with a role and mails it the link. Administrators only.
  409 `invitations.errors.already-member` for an address that has an account,
  `invitations.errors.already-pending` for one already invited (revoke first),
  `invitations.errors.limit` past 200 pending.
  """
  inviteMember(
    """The address to invite."""
    email: EmailAddress!
    """The role it gets on accepting."""
    role: Role!
  ): Invitation!
  """Starts the registration of a passkey for the viewer."""
  passkeyRegistrationOptions: PasskeyChallenge!
  """
  Starts a passkey sign-in: anonymous, counted by the request's address (429
  `auth.errors.too-many-attempts`). Finish it with `signInWithPasskey`.
  """
  passkeySignInOptions: PasskeyChallenge!
  """
  Pins or unpins a message (idempotent). 404
  `conversations.errors.message-not-found`.
  """
  pinMessage(
    """The message's id."""
    messageId: ID! @constraint(maxLength: 64)
    """Whether it is pinned."""
    pinned: Boolean!
  ): Message!
  """
  Toggles the member's reaction: added when absent, taken back when present.
  `emoji` is one emoji (a single character as the keyboard gives it, at most
  32 units). 404 `conversations.errors.message-not-found`; 400
  `validation.errors.invalid-input` with `emoji` invalid
  (`conversations.errors.invalid-emoji`); 409
  `conversations.errors.reaction-limit` past 20 reactions on a message.
  """
  react(
    """The emoji."""
    emoji: String! @constraint(minLength: 1, maxLength: 32)
    """The message's id."""
    messageId: ID! @constraint(maxLength: 64)
  ): Message!
  """
  A recovery code instead of the app's, for a lost phone; each works once. The
  account is mailed a notice. Refused as confirmSecondFactor.
  """
  recoverSecondFactor(
    """The `challenge` of the SECOND_FACTOR answer."""
    challenge: String! @constraint(maxLength: 200)
    """One unused recovery code, at most 40 characters."""
    recoveryCode: String! @constraint(maxLength: 40)
  ): SignInPayload!
  """
  Writes a new reply to the same member's message, as a new run and a new
  branch. `modelId` becomes the conversation's model. 404
  `conversations.errors.message-not-found`; 409
  `conversations.errors.not-regenerable` for a member's message,
  `conversations.errors.model-unavailable` (field `modelId`), plus
  `sendMessage`'s.
  """
  regenerate(
    """The answer to answer again."""
    messageId: ID! @constraint(maxLength: 64)
    """The model to answer with; the conversation's when left out."""
    modelId: String @constraint(minLength: 1, maxLength: 200)
  ): SendMessagePayload!
  """
  Replaces all the recovery codes with ten new ones, on a current code of the
  app: the old ones stop working. Needs a session confirmed within 10 minutes
  (403 `auth.errors.step-up-required`). A wrong code is `auth.errors.invalid-code`
  (with `attemptsLeft`; past five tries per account in a 15-minute window,
  every call is refused, the right code included, with `extensions.reason`
  `throttled` and `extensions.retryAfter` in seconds; janus counts these tries
  together with the app codes given to confirmStepUp, which disableSecondFactor
  also goes through); no active factor is
  `auth.errors.second-factor-state`.
  """
  regenerateRecoveryCodes(
    """A current code of the authenticator app."""
    code: String! @constraint(maxLength: 20)
  ): RecoveryCodes!
  """
  Finishes it. Needs a session confirmed within 10 minutes (403
  `auth.errors.step-up-required`). 400 `auth.errors.passkey-invalid` (a response
  that does not verify, a bad name); 409 `auth.errors.passkey-taken` for a
  credential already registered and `auth.errors.passkey-limit` past the most an
  account may hold.
  """
  registerPasskey(
    """The `challenge` of `passkeyRegistrationOptions`."""
    challenge: String! @constraint(maxLength: 200)
    """The name to give it, 1 to 100 characters."""
    name: String! @constraint(minLength: 1, maxLength: 100)
    """What `navigator.credentials.create` produced."""
    response: JSONObject!
  ): Passkey!
  """
  Indexes a FAILED (or never started) document again and answers it PENDING. A
  PDF cannot be retried: 409 `projects.errors.document-not-retryable`, also for
  an INDEXED one. 404 `projects.errors.document-not-found`.
  """
  reindexProjectDocument(
    """The document's id."""
    id: ID! @constraint(maxLength: 64)
  ): ProjectDocument!
  """
  Rejects a pending action: nothing runs. Answers an action already decided as it
  stands. 404 `conversations.errors.action-not-found`; 409
  `conversations.errors.action-expired` past its expiry (the action becomes EXPIRED).
  """
  rejectAction(
    """The action's id."""
    id: ID!
  ): ProposedAction!
  """
  Removes one of the viewer's passkeys; false for one that is not theirs. Needs
  a session confirmed within 10 minutes (403 `auth.errors.step-up-required`).
  """
  removePasskey(
    """The passkey's credential id."""
    id: ID! @constraint(maxLength: 200)
  ): Boolean!
  """
  Renames one of the viewer's passkeys; false for one that is not theirs.
  """
  renamePasskey(
    """The passkey's credential id."""
    id: ID! @constraint(maxLength: 200)
    """The new name, 1 to 100 characters."""
    name: String! @constraint(minLength: 1, maxLength: 100)
  ): Boolean!
  """
  Puts the featured personas in this order: `ids` first, then the featured ones
  it leaves out, in their order. Administrators only: 403
  `auth.errors.forbidden`. All or nothing: an id that is not featured is
  `personas.errors.not-found` on `ids.<i>` of one `validation.errors.invalid-input`.
  Answers the featured personas in their new order.
  """
  reorderFeatured(
    """
    The featured personas' ids, in the wanted order (at most 100, each once).
    """
    ids: [ID!]! @constraint(maxItems: 100, maxLength: 64)
  ): [Persona!]!
  """
  Sends a password-reset link (`/auth/reset-password`). True once accepted,
  whether or not the e-mail holds an account; throttled as `requestMagicLink`.
  """
  requestPasswordReset(
    """The address to mail the link to, at most 320 characters."""
    email: String! @constraint(maxLength: 320)
  ): Boolean!
  """
  Starts a step-up of the request's session: a code of the authenticator app
  when the account has an active second factor, else a code mailed to the
  account's current address. 401 without a viewer; 429
  `auth.errors.too-many-attempts` past five mailed codes in 10 minutes.
  """
  requestStepUp: StepUpChallenge!
  """
  Sets a new password from a reset link's token, and signs the account out
  everywhere: sign in again after it. 400 `auth.errors.invalid-token`, 400
  `validation.errors.invalid-input` (a `too-short` issue on `password`); 429
  past the per-IP limit on tokens.
  """
  resetPassword(
    """The new password; at least 8, at most 1024 characters."""
    password: String! @constraint(maxLength: 1024)
    """The token of the reset link, at most 200 characters."""
    token: String! @constraint(maxLength: 200)
  ): Boolean!
  """
  Brings back a conversation deleted less than 30 days ago (a live one is
  returned as it is). 404 `conversations.errors.not-found`; 409
  `conversations.errors.restore-expired`.
  """
  restoreConversation(
    """The conversation's id."""
    id: ID! @constraint(maxLength: 64)
  ): Conversation!
  """
  Brings back a project deleted less than 30 days ago (a live one is returned as it is). 404 `projects.errors.not-found` for an unknown one or one past the window.
  """
  restoreProject(
    """The project's id."""
    id: ID! @constraint(maxLength: 64)
  ): Project!
  """
  Cancels a pending invitation. Administrators only. 404 `invitations.errors.not-found`, 409 `invitations.errors.not-pending`.
  """
  revokeInvitation(
    """The invitation's id."""
    id: ID! @constraint(maxLength: 64)
  ): Invitation!
  """
  Sends a message and starts the run that answers it. 404
  `conversations.errors.not-found`; 400 `validation.errors.invalid-input` with
  `parentId` invalid (`conversations.errors.invalid-parent`) or an attachment id
  that cannot be attached (`attachments.errors.not-attachable`); 409
  `conversations.errors.run-in-progress` while an answer is still being written
  in the conversation; 409 `conversations.errors.persona-unavailable` once the
  persona is someone else's PRIVATE one; 409 `models.errors.offline` or
  `models.errors.disabled` for a model that cannot answer (nothing is written);
  429 `conversations.errors.too-many-messages`.
  """
  sendMessage(
    """The conversation, its parent message and the text."""
    input: SendMessageInput!
  ): SendMessagePayload!
  """
  Shows the branch through a message: `Conversation.activeLeafId` moves to the
  deepest leaf below it, following the latest child at each step. 404
  `conversations.errors.not-found` or `conversations.errors.message-not-found`;
  409 `conversations.errors.run-in-progress` while an answer is being written.
  """
  setActiveBranch(
    """The conversation's id."""
    conversationId: ID! @constraint(maxLength: 64)
    """A message of the branch to show."""
    messageId: ID! @constraint(maxLength: 64)
  ): Conversation!
  """
  Changes the model of one of the member's conversations. 404
  `conversations.errors.not-found`, 409 `conversations.errors.model-unavailable`
  (field `modelId`) for a model that is unknown or not enabled.
  """
  setConversationModel(
    """The conversation's id."""
    id: ID! @constraint(maxLength: 64)
    """The model the next message goes to."""
    modelId: String! @constraint(minLength: 1, maxLength: 200)
  ): Conversation!
  """
  Puts one of the member's conversations in one of their live projects, or takes
  it out of its project with a null `projectId`. From the next message on, runs
  carry the project's instructions and the `search_project` tool. 404
  `conversations.errors.not-found`; 404 `projects.errors.not-found` for an
  unknown, deleted or another member's project.
  """
  setConversationProject(
    """The conversation's id."""
    id: ID! @constraint(maxLength: 64)
    """The project, or null for none."""
    projectId: ID @constraint(maxLength: 64)
  ): Conversation!
  """
  Sets the default monthly budget, in USD (0 to 100000; 0 allows no paid model). Administrators only.
  """
  setDefaultBudget(
    """The default monthly budget, in USD."""
    monthlyUsd: Float! @constraint(min: 0, max: 100000)
  ): BudgetSettings!
  """
  Sets a member's own monthly budget in USD, or null to follow the default.
  A raised budget lifts a refusal at once. Administrators only. 404
  `members.errors.not-found`.
  """
  setMemberBudget(
    """The member's id."""
    memberId: ID! @constraint(maxLength: 64)
    """
    The member's monthly budget in USD (0 to 100000); null follows the default.
    """
    monthlyUsd: Float @constraint(min: 0, max: 100000)
  ): MemberBudget!
  """
  Gives a member its one role. The last administrator cannot be demoted: 409
  `members.errors.last-admin`. Administrators only.
  """
  setMemberRole(
    """The member's id."""
    id: ID! @constraint(maxLength: 64)
    """The role to give."""
    role: Role!
  ): Member!
  """
  Enables or disables a model for conversations (a no-op when it already is).
  Administrators only: 403 `auth.errors.forbidden`. 404
  `models.errors.not-found` for an id that names no model.
  """
  setModelEnabled(
    """Whether conversations may use it."""
    enabled: Boolean!
    """The model's public id."""
    id: ID! @constraint(maxLength: 200)
  ): Model!
  """
  Features a TEAM persona in the catalogue, last in the order (or unfeatures
  it). Administrators only: 403 `auth.errors.forbidden`. 404
  `personas.errors.not-found` for a persona that is deleted or not TEAM (a
  PRIVATE one is never revealed).
  """
  setPersonaFeatured(
    """Whether to feature it."""
    featured: Boolean!
    """The persona's id."""
    id: ID! @constraint(maxLength: 64)
  ): Persona!
  """
  Signs in with an e-mail and a password. 401 `auth.errors.invalid-credentials`
  for an unknown address, a disabled account and a wrong password alike; 429
  `auth.errors.too-many-attempts` (with `retryAfter`) past the per-address
  limits.
  """
  signIn(
    """The credentials."""
    input: SignInInput!
  ): SignInPayload!
  """
  Finishes a passkey sign-in with what `navigator.credentials.get` produced. No
  password and no code: the device's verification is the whole proof. 401
  `auth.errors.invalid-credentials` for any refusal; 400
